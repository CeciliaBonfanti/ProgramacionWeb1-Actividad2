<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilos/styles.css">
</head>
<body>
    <main class="contenedor-principal">
        <nav class="navbar">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="contacto.html">CONTACTO</a></li>
            </ul>
        </nav>

        <section class="seccion-contacto">
            <h2>Contacto</h2>
            <p>¿Tenés alguna duda, sugerencia o querés compartir tu propia receta? Envianos un mensaje.</p>

            <form action="#" method="POST">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required>

                <label for="tel">Tel:</label>
                <input type="tel" id="tel" name="tel" placeholder="11XXXXXXXX" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribí tu mensaje acá..." required></textarea>

                <div class="contenedor-botones">
                    <button type="submit">Enviar</button>
                    <button type="reset" >Cancelar</button>
                </div>
            </form>
        </section>

        <footer class="footer">
            <p>Todos los derechos reservados</p>
        </footer>
    </main>
    
</body>
</html>
