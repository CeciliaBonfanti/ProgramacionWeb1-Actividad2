<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 -250 500 500" width="500" height="500">
  <defs>
    <!-- Diente simétrico del engranaje -->
    <path id="diente" d="M -32,-215 L 32,-215 C 36,-215 40,-211 41,-207 L 48,-158 C 48,-155 46,-152 43,-150 C 30,-143 15,-138 0,-138 C -15,-138 -30,-143 -43,-150 C -46,-152 -48,-155 -48,-158 L -41,-207 C -40,-211 -36,-215 -32,-215 Z" fill="#E6DCFA"/>
  </defs>

  <!-- Base circular del engranaje con su hueco interior -->
  <path fill="#E6DCFA" fill-rule="evenodd" d="
    M 0,-175 
    A 175,175 0 1,1 0,175 
    A 175,175 0 1,1 0,-175 Z 
    M 0,-105 
    A 105,105 0 1,0 0,105 
    A 105,105 0 1,0 0,-105 Z" />

  <!-- 8 dientes distribuidos de forma radial exacta a 45 grados -->
  <use href="#diente" />
  <use href="#diente" transform="rotate(45)" />
  <use href="#diente" transform="rotate(90)" />
  <use href="#diente" transform="rotate(135)" />
  <use href="#diente" transform="rotate(180)" />
  <use href="#diente" transform="rotate(225)" />
  <use href="#diente" transform="rotate(270)" />
  <use href="#diente" transform="rotate(315)" />

  <!-- Anillo concéntrico blanco decorativo -->
  <circle cx="0" cy="0" r="120" fill="none" stroke="#FFFFFF" stroke-width="7" />
</svg>
